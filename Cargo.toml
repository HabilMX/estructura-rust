[package]
name = "revisor"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Revisa si una lista de servicios responde por HTTP. La semilla de la plantilla estructura-rust."
license = "MIT"
publish = false

# Cargo encuentra solo src/lib.rs (la biblioteca), src/main.rs (el programa) y
# cada archivo de tests/ (una prueba de integración por archivo): son sus rutas
# convencionales, así que aquí no se declara ninguna.

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
yaml_serde = "0.10.7"
